logs:
  logLevel: info            # trace / debug / info / warn / error / fatal / panic

database:
  address: 127.0.0.1
  port: 3306
  username: root
  password: root
  database: gotools_demo
  logLevel: 4               # GORM logger：1 Silent / 2 Error / 3 Warn / 4 Info

router:
  host: 0.0.0.0
  port: 8080
  disableTLS: true          # 生产环境去掉这行并填 certPath / keyPath
  certPath: server.pem
  keyPath: server.key

crypto:
  aesKey: "YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4"   # base64 的 24 字节密钥
